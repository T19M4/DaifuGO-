<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大富豪 ローカル対戦</title>
<style>
*{box-sizing:border-box}
:root{--felt:#064b37;--felt2:#033726;--gold:#ffd85a}
body{margin:0;background:#10251f;color:white;font-family:system-ui,sans-serif}
header{padding:12px;text-align:center;background:#071b16;border-bottom:2px solid #34735d}
h1{font-size:25px;margin:0}
button{cursor:pointer;font-weight:bold;border:0;border-radius:8px;padding:10px 14px}
button:disabled{opacity:.35;cursor:not-allowed}
.primary{background:var(--gold);color:#182018}
.secondary{background:#31594b;color:white}
.danger{background:#b83d48;color:white}
main{max-width:1100px;margin:auto;padding:12px}
.status{text-align:center;background:#183b30;padding:12px;border-radius:10px;margin-bottom:12px}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.player{background:#18372e;border:2px solid #31594b;border-radius:10px;padding:10px;text-align:center}
.player.active{border-color:var(--gold);box-shadow:0 0 12px #ffd85a55}
.player-name{font-weight:bold;font-size:15px}
.count{font-size:13px;color:#d5e8df;margin-top:5px}
.table{margin:12px 0;background:radial-gradient(ellipse,var(--felt),var(--felt2));border:3px solid #397b60;border-radius:16px;min-height:230px;padding:14px;text-align:center}
.table-title{color:#d8e9de;font-size:14px;margin-bottom:10px}

.card{width:57px;height:83px;border-radius:8px;background:#fff;color:#222;border:2px solid #ddd;display:flex;flex-direction:column;justify-content:space-between;padding:5px 4px;box-shadow:0 3px 5px #0004;user-select:none}
.card.red{color:#d32638}
.card.black{color:#20252b}
.card .rank{font-size:18px;font-weight:900;text-align:left}
.card .suit{font-size:25px;text-align:center;line-height:1}
.card .bottom{font-size:12px;text-align:right;transform:rotate(180deg)}
.card.selected{transform:translateY(-12px);border:3px solid #ffc928;box-shadow:0 0 9px #ffd85a}
.card.small{width:43px;height:62px;padding:3px}

.log p{margin:4px 0}
.removed{background:#30251c;border:1px solid #856c3f;border-radius:10px;padding:10px;margin-top:12px}

.note{font-size:12px;color:#d3e4dc;margin-top:8px;text-align:center}

.overlay.show{display:flex}
.modal{background:#18372e;border:2px solid #69977f;border-radius:14px;padding:20px;width:min(520px,100%);max-height:85vh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:21px}
.modal p{font-size:14px}
.choice-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:15px 0}
.choice-card{cursor:pointer}
.q-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}

.q-rank:disabled{opacity:.25}
.modal-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:600px){
 h1{font-size:21px}
 main{padding:8px}
 .players{grid-template-columns:repeat(2,1fr)}
 .table{min-height:190px;padding:9px}
 .card{width:46px;height:70px}
 .card .rank{font-size:15px}
 .card .suit{font-size:21px}
 .hand{gap:5px}
 .hand-area{padding:8px}
 button{padding:10px}
}
</style>
</head>
<body>
<header><h1>♠ 大富豪 ローカル対戦 ♠</h1></header>

<main>
  <div class="status" id="status">ゲーム準備中...</div>

  <div class="players" id="players"></div>

  <section class="table" id="tableArea" onclick="showHistory()">
    <div class="table-title">場のカード（タップで履歴を確認）</div>
    <div class="cards" id="tableCards">
      <span>ゲーム開始を押してください</span>
    </div>
    <div id="tableInfo" class="note"></div>
  </section>

  <section class="hand-area">
    <div class="section-title">あなたの手札</div>
    <div class="hand" id="hand"></div>
    <div class="controls">
      <button class="primary" id="playBtn" onclick="playSelected()">カードを出す</button>
      <button class="secondary" id="passBtn" onclick="passTurn()">パス</button>
      <button class="secondary" onclick="showMyHand()">手札を確認</button>
      <button class="danger" onclick="startGame()">新しいゲーム</button>
    </div>
    <div class="note">カードをタップして選択してから「カードを出す」を押してください。</div>
  </section>

  <section class="removed">
    <div class="section-title">💥 Qボンバーで消えたカード</div>
    <div class="cards" id="removedCards"><span>まだありません</span></div>
  </section>

  <section class="log" id="log"><b>ゲーム履歴</b></section>
</main>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">確認</h2>
    <p id="modalText"></p>
    <div id="modalContent"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
"use strict";

const PLAYER_COUNT = 4;
const SUITS = ["♠","♥","♦","♣"];
const Q_RANK_OPTIONS = [4,7,10,12,14,15,16];
const FORBIDDEN_GIVE = [7,8,10,12,14,15,16];

const rankName = r => ({
  11:"J",12:"Q",13:"K",14:"A",15:"2",16:"ジョーカー"
}[r] || String(r));

let players = [];
let current = 0;
let table = [];
let tableHistory = [];
let selected = [];
let passes = 0;
let lastPlayer = 0;
let trickNumber = 0;
let gameStarted = false;
let gameOver = false;
let lockedSuit = null;
let pending = null;
let qSelectedRanks = [];
let qRequiredCount = 0;
let removedCards = [];
let nextCardId = 1;
let cpuTimer = null;

function makeDeck(){
  const deck = [];
  for(const suit of SUITS){
    for(let rank=3;rank<=15;rank++){
      deck.push({id:nextCardId++,suit,rank});
    }
  }
  deck.push({id:nextCardId++,suit:"★",rank:16});
  return deck;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startGame(){
  if(cpuTimer) clearTimeout(cpuTimer);
  closeModal();
  nextCardId=1;
  const deck=shuffle(makeDeck());
  players=Array.from({length:PLAYER_COUNT},(_,i)=>({
    name:i===0?"あなた":`CPU ${i}`,
    hand:[],
    finished:false
  }));
  deck.forEach((card,i)=>players[i%PLAYER_COUNT].hand.push(card));
  players.forEach(p=>sortHand(p.hand));

  current=0;
  table=[];
  tableHistory=[];
  selected=[];
  passes=0;
  lastPlayer=0;
  trickNumber=1;
  gameStarted=true;
  gameOver=false;
  lockedSuit=null;
  pending=null;
  qSelectedRanks=[];
  qRequiredCount=0;
  removedCards=[];
  addLog("ゲーム開始！");
  addLog("あなたからスタートします。");
  render();
}

function sortHand(hand){
  hand.sort((a,b)=>a.rank-b.rank || SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit));
}

function cardText(card){
  return card.rank===16?"ジョーカー":`${card.suit}${rankName(card.rank)}`;
}

function cardHTML(card,small=false){
  const color=(card.suit==="♥"||card.suit==="♦"||card.suit==="★")?"red":"black";
  return `<div class="card ${color}${small?" small":""}">
    <div class="rank">${rankName(card.rank)}</div>
    <div class="suit">${card.suit}</div>
    <div class="bottom">${rankName(card.rank)}</div>
  </div>`;
}

function render(){
  renderPlayers();
  renderTable();
  renderHand();
  renderRemoved();
  renderStatus();
  const myTurn=gameStarted&&!gameOver&&current===0&&!pending;
  document.getElementById("playBtn").disabled=!myTurn||selected.length===0;
  document.getElementById("passBtn").disabled=!myTurn;
}

function renderPlayers(){
  document.getElementById("players").innerHTML=players.map((p,i)=>`
    <div class="player ${i===current&&!gameOver?"active":""}">
      <div class="player-name">${p.name}${p.finished?" 🏁":""}</div>
      <div class="count">${p.finished?"上がり":`手札：${p.hand.length}枚`}</div>
    </div>`).join("");
}

function renderTable(){
  const area=document.getElementById("tableCards");
  if(!table.length){
    area.innerHTML="<span>場は空です</span>";
  }else{
    area.innerHTML=table.map(c=>cardHTML(c)).join("");
  }
  document.getElementById("tableInfo").textContent=
    `${lockedSuit?`縛り：${lockedSuit} `:""}${table.length?`出した枚数：${table.length}枚`:""}　（タップで履歴）`;
}

function renderHand(){
  const hand=players[0]?.hand||[];
  document.getElementById("hand").innerHTML=hand.map(card=>`
    <div class="card ${(card.suit==="♥"||card.suit==="♦"||card.suit==="★")?"red":"black"} ${selected.includes(card.id)?"selected":""}"
      onclick="toggleCard(${card.id})">
      <div class="rank">${rankName(card.rank)}</div>
      <div class="suit">${card.suit}</div>
      <div class="bottom">${rankName(card.rank)}</div>
    </div>`).join("");
}

function renderRemoved(){
  const el=document.getElementById("removedCards");
  el.innerHTML=removedCards.length
    ?removedCards.map(c=>cardHTML(c,true)).join("")
    :"<span>まだありません</span>";
}

function renderStatus(){
  const el=document.getElementById("status");
  if(!gameStarted){el.textContent="「新しいゲーム」を押して開始してください。";return;}
  if(gameOver){el.textContent="ゲーム終了！「新しいゲーム」で再戦できます。";return;}
  if(pending){el.textContent="選択画面を操作してください。";return;}
  el.textContent=`第${trickNumber}回の場　／　現在の手番：${players[current].name}${current===0?"（あなた）":"（CPUの番）"}`;
}

function addLog(message){
  const log=document.getElementById("log");
  const p=document.createElement("p");
  p.textContent=message;
  log.appendChild(p);
  log.scrollTop=log.scrollHeight;
}

function toggleCard(id){
  if(current!==0||pending||gameOver)return;
  if(selected.includes(id)) selected=selected.filter(x=>x!==id);
  else selected.push(id);
  renderHand();
  document.getElementById("playBtn").disabled=selected.length===0;
}

function showMyHand(){
  if(!players.length)return;
  openModal("あなたの手札","現在の手札です。",players[0].hand.map(c=>cardHTML(c,true)).join(""),[
    {label:"閉じる",className:"secondary",action:closeModal}
  ]);
}

function showHistory(){
  if(!gameStarted)return;
  const history=tableHistory.length
    ?tableHistory.map((entry,i)=>`<p>${i+1}. ${entry}</p>`).join("")
    :"<p>この場ではまだカードが出されていません。</p>";
  openModal("場のカード・履歴","現在の場に至るまでの記録です。",history,[
    {label:"閉じる",className:"secondary",action:closeModal}
  ]);
}

function openModal(title,text,content,actions=[]){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalText").textContent=text;
  document.getElementById("modalContent").innerHTML=content;
  document.getElementById("modalActions").innerHTML="";
  document.getElementById("modalOverlay").classList.add("show");
  actions.forEach(a=>{
    const btn=document.createElement("button");
    btn.textContent=a.label;
    btn.className=a.className||"primary";
    btn.disabled=!!a.disabled;
    btn.onclick=a.action;
    document.getElementById("modalActions").appendChild(btn);
  });
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("show");
}

function nextActive(from){
  for(let step=1;step<=PLAYER_COUNT;step++){
    const i=(from+step)%PLAYER_COUNT;
    if(!players[i].finished)return i;
  }
  return from;
}

function sameRank(cards){
  return cards.length>0 && cards.every(c=>c.rank===cards[0].rank);
}

function canBeat(cards){
  if(!cards.length||!sameRank(cards))return false;
  if(cards.length>1&&cards.some(c=>c.rank===16))return false;
  if(table.length&&cards.length!==table.length)return false;

  if(lockedSuit&&cards.every(c=>c.suit!==lockedSuit))return false;

  if(!table.length)return true;
  if(cards[0].rank===16&&table[0].rank!==16)return true;
  if(table[0].rank===16)return false;
  return cards[0].rank>table[0].rank;
}

function playSelected(){
  if(current!==0||pending||gameOver)return;
  const hand=players[0].hand;
  const cards=hand.filter(c=>selected.includes(c.id));
  if(!cards.length)return;
  if(!sameRank(cards)){
    alert("同じ数字のカードを選んでください。");
    return;
  }
  if(!canBeat(cards)){
    alert("そのカードは今の場に出せません。枚数・数字・縛りを確認してください。");
    return;
  }
  executePlay(0,cards);
}

function executePlay(playerIndex,cards){
  const p=players[playerIndex];
  const oldTable=table.slice();
  const oldSuit=oldTable.length===1?oldTable[0].suit:null;

  cards.forEach(c=>{
    const idx=p.hand.findIndex(x=>x.id===c.id);
    if(idx>=0)p.hand.splice(idx,1);
  });

  // 縛りは、場にすでにカードがある場合に限って判定する。
  // 新しい場の最初のカードだけでは縛りを発生させない。
  if(oldTable.length&&oldSuit&&cards.length===1&&cards[0].suit===oldSuit){
    lockedSuit=oldSuit;
  }else if(!oldTable.length){
    lockedSuit=null;
  }

  table=cards.slice();
  tableHistory.push(`${p.name}：${cards.map(cardText).join(" ")}`);
  lastPlayer=playerIndex;
  passes=0;
  selected=[];
  addLog(`${p.name} が ${cards.map(cardText).join("、")} を出しました。`);

  if(p.hand.length===0){
    p.finished=true;
    addLog(`${p.name} が上がりました！`);
  }

  render();

  if(checkGameOver())return;

  // 特殊効果を順番に処理する。
  const n7=cards.filter(c=>c.rank===7).length;
  const n10=cards.filter(c=>c.rank===10).length;
  const nQ=cards.filter(c=>c.rank===12).length;

  if(n7>0){
    if(playerIndex===0)beginGiveChoice(playerIndex,n7);
    else cpuGive(playerIndex,n7);
    return;
  }
  if(n10>0){
    if(playerIndex===0)beginDiscardChoice(playerIndex,n10);
    else cpuDiscard(playerIndex,n10);
    return;
  }
  if(nQ>0){
    if(playerIndex===0)beginQBombChoice(nQ);
    else cpuQBomb(nQ);
    return;
  }
  continueAfterPlay(playerIndex);
}

function continueAfterPlay(playerIndex){
  if(checkGameOver())return;
  current=nextActive(playerIndex);
  render();
  if(current!==0) scheduleCPU();
}

function passTurn(){
  if(current!==0||pending||gameOver)return;
  if(!table.length){
    alert("場が空のときはパスできません。");
    return;
  }
  doPass(0);
}

function doPass(playerIndex){
  passes++;
  addLog(`${players[playerIndex].name} はパスしました。`);
  selected=[];
  if(passes>=players.filter(p=>!p.finished).length-1){
    addLog("全員がパスしたため、場が流れました。");
    table=[];
    tableHistory=[];
    lockedSuit=null;
    passes=0;
    trickNumber++;
    current=players[lastPlayer].finished?nextActive(lastPlayer):lastPlayer;
  }else{
    current=nextActive(playerIndex);
  }
  render();
  if(!gameOver&&current!==0)scheduleCPU();
}

function beginGiveChoice(playerIndex,count){
  const p=players[playerIndex];
  const target=nextActive(playerIndex);
  const eligible=p.hand.filter(c=>!FORBIDDEN_GIVE.includes(c.rank));
  if(!eligible.length){
    addLog(`${p.name} は7渡しで渡せるカードがありません。`);
    continueAfterPlay(playerIndex);
    return;
  }
  if(playerIndex!==0){
    cpuGive(playerIndex,count);
    return;
  }
  pending={type:"give",playerIndex,target,count,chosen:[]};
  renderGiveModal();
}

function renderGiveModal(){
  const p=players[pending.playerIndex];
  const eligible=p.hand.filter(c=>!FORBIDDEN_GIVE.includes(c.rank));
  const chosen=pending.chosen;
  const content=eligible.map(c=>`
    <div class="choice-card" onclick="togglePendingCard(${c.id})"
      style="opacity:${chosen.includes(c.id)?1:.75};border:${chosen.includes(c.id)?"3px solid #ffd85a":"3px solid transparent"};border-radius:8px">
      ${cardHTML(c,true)}
    </div>`).join("");
  openModal("7渡し",`渡すカードを${pending.count}枚選んでください。送り先：${players[pending.target].name}`,content,[
    {label:`渡す（${chosen.length}/${pending.count}）`,className:"primary",disabled:chosen.length!==pending.count,action:confirmGive},
    {label:"手札を見る",className:"secondary",action:()=>showMyHand()}
  ]);
}

function togglePendingCard(id){
  if(!pending)return;
  const p=players[pending.playerIndex];
  const card=p.hand.find(c=>c.id===id);
  if(!card)return;
  if(pending.type==="give"&&FORBIDDEN_GIVE.includes(card.rank))return;
  if(pending.chosen.includes(id)){
    pending.chosen=pending.chosen.filter(x=>x!==id);
  }else if(pending.chosen.length<pending.count){
    pending.chosen.push(id);
  }
  if(pending.type==="give")renderGiveModal();
  else if(pending.type==="discard")renderDiscardModal();
}

function confirmGive(){
  if(!pending||pending.type!=="give"||pending.chosen.length!==pending.count)return;
  const {playerIndex,target,chosen}=pending;
  const giver=players[playerIndex],receiver=players[target];
  const cards=[];
  chosen.forEach(id=>{
    const i=giver.hand.findIndex(c=>c.id===id);
    if(i>=0)cards.push(giver.hand.splice(i,1)[0]);
  });
  receiver.hand.push(...cards);
  sortHand(receiver.hand);
  pending=null;
  closeModal();
  addLog(`${giver.name} が ${receiver.name} に ${cards.length}枚渡しました。`);
  render();
  if(checkGameOver())return;
  continueAfterPlay(playerIndex);
}

function cpuGive(playerIndex,count){
  const giver=players[playerIndex];
  const target=nextActive(playerIndex);
  const eligible=giver.hand.filter(c=>!FORBIDDEN_GIVE.includes(c.rank));
  const cards=eligible.sort((a,b)=>a.rank-b.rank).slice(0,count);
  if(cards.length){
    cards.forEach(c=>giver.hand.splice(giver.hand.findIndex(x=>x.id===c.id),1));
    players[target].hand.push(...cards);
    sortHand(players[target].hand);
    addLog(`${giver.name} が ${players[target].name} に ${cards.length}枚渡しました。`);
  }else{
    addLog(`${giver.name} は渡せるカードがありません。`);
  }
  render();
  if(checkGameOver())return;
  continueAfterPlay(playerIndex);
}

function beginDiscardChoice(playerIndex,count){
  const p=players[playerIndex];
  if(playerIndex!==0){
    cpuDiscard(playerIndex,count);
    return;
  }
  if(!p.hand.length){
    continueAfterPlay(playerIndex);
    return;
  }
  pending={type:"discard",playerIndex,count,chosen:[]};
  renderDiscardModal();
}

function renderDiscardModal(){
  const p=players[pending.playerIndex];
  const chosen=pending.chosen;
  const content=p.hand.map(c=>`
    <div class="choice-card" onclick="togglePendingCard(${c.id})"
      style="opacity:${chosen.includes(c.id)?1:.75};border:${chosen.includes(c.id)?"3px solid #ffd85a":"3px solid transparent"};border-radius:8px">
      ${cardHTML(c,true)}
    </div>`).join("");
  openModal("10捨て",`捨てるカードを${pending.count}枚選んでください。`,content,[
    {label:`捨てる（${chosen.length}/${pending.count}）`,className:"primary",disabled:chosen.length!==pending.count,action:confirmDiscard},
    {label:"手札を見る",className:"secondary",action:()=>showMyHand()}
  ]);
}

function confirmDiscard(){
  if(!pending||pending.type!=="discard"||pending.chosen.length!==pending.count)return;
  const {playerIndex,chosen}=pending;
  const p=players[playerIndex];
  const discarded=[];
  chosen.forEach(id=>{
    const i=p.hand.findIndex(c=>c.id===id);
    if(i>=0)discarded.push(p.hand.splice(i,1)[0]);
  });
  pending=null;
  closeModal();
  addLog(`${p.name} が10捨てで ${discarded.length}枚捨てました。`);
  render();
  if(checkGameOver())return;
  continueAfterPlay(playerIndex);
}

function cpuDiscard(playerIndex,count){
  const p=players[playerIndex];
  const discarded=p.hand.slice().sort((a,b)=>b.rank-a.rank).slice(0,count);
  discarded.forEach(c=>p.hand.splice(p.hand.findIndex(x=>x.id===c.id),1));
  addLog(`${p.name} が10捨てで ${discarded.length}枚捨てました。`);
  render();
  if(checkGameOver())return;
  continueAfterPlay(playerIndex);
}

function beginQBombChoice(count){
  qRequiredCount=count;
  qSelectedRanks=[];
  pending={type:"qbomb",playerIndex:0,count};
  renderQBombModal();
}

function toggleQRank(rank){
  if(!pending||pending.type!=="qbomb")return;
  // すでに選んだ数字を押すと解除する。
  if(qSelectedRanks.includes(rank)){
    qSelectedRanks=qSelectedRanks.filter(r=>r!==rank);
  }else{
    // 選択済みの数字は重複できない。
    // Qの枚数分だけ、異なる数字を選べる。
    if(qSelectedRanks.length>=qRequiredCount)return;
    qSelectedRanks.push(rank);
  }
  renderQBombModal();
}

function renderQBombModal(){
  const options=Q_RANK_OPTIONS.map(rank=>{
    const chosen=qSelectedRanks.includes(rank);
    const disabled=!chosen&&qSelectedRanks.length>=qRequiredCount;
    return `<button class="q-rank ${chosen?"chosen":""}" ${disabled?"disabled":""}
      onclick="toggleQRank(${rank})">${rankName(rank)}</button>`;
  }).join("");
  const content=`<div class="q-options">${options}</div>
    <p>選択中：${qSelectedRanks.map(rankName).join("、")||"なし"}
    （${qSelectedRanks.length}/${qRequiredCount}）</p>`;
  openModal("Qボンバー",`Qを出した枚数分、異なる数字を宣言してください。同じ数字は選べません。`,content,[
    {label:"宣言する",className:"primary",disabled:qSelectedRanks.length!==qRequiredCount,action:confirmQBomb},
    {label:"手札を見る",className:"secondary",action:()=>showMyHand()}
  ]);
}

function confirmQBomb(){
  if(!pending||pending.type!=="qbomb"||qSelectedRanks.length!==qRequiredCount)return;
  const ranks=qSelectedRanks.slice();
  const playerIndex=pending.playerIndex;
  pending=null;
  closeModal();
  applyQBomb(ranks,playerIndex);
  if(checkGameOver())return;
  continueAfterPlay(playerIndex);
}

function cpuQBomb(count){
  // CPUもQボンバーを使用し、同じ数字を重複宣言しない。
  const shuffled=shuffle(Q_RANK_OPTIONS.slice());
  const ranks=shuffled.slice(0,Math.min(count,Q_RANK_OPTIONS.length));
  addLog(`${players[current].name} がQボンバーを宣言しました。`);
  applyQBomb(ranks,current);
  if(checkGameOver())return;
  continueAfterPlay(current);
}

function applyQBomb(ranks,playerIndex){
  const removed=[];
  for(const p of players){
    const keep=[];
    for(const c of p.hand){
      if(ranks.includes(c.rank))removed.push(c);
      else keep.push(c);
    }
    p.hand=keep;
  }
  // 場に出ているカードも、宣言された数字なら消す。
  const newTable=[];
  for(const c of table){
    if(ranks.includes(c.rank))removed.push(c);
    else newTable.push(c);
  }
  table=newTable;
  removedCards.push(...removed);
  players.forEach(p=>sortHand(p.hand));
  addLog(`${players[playerIndex].name} のQボンバー：${ranks.map(rankName).join("・")} を宣言。${removed.length}枚が消えました。`);
  render();
}

function checkGameOver(){
  const remaining=players.filter(p=>!p.finished);
  if(remaining.length<=1){
    gameOver=true;
    if(remaining.length===1){
      remaining[0].finished=true;
      addLog(`${remaining[0].name} が最後に残りました。`);
    }
    addLog("ゲーム終了！");
    render();
    openModal("ゲーム終了","対戦が終了しました。",players.map(p=>`<p>${p.name}：${p.finished?"上がり":p.hand.length+"枚残り"}</p>`).join(""),[
      {label:"もう一度遊ぶ",className:"primary",action:startGame},
      {label:"閉じる",className:"secondary",action:closeModal}
    ]);
    return true;
  }
  return false;
}

function findCPUPlay(playerIndex){
  const hand=players[playerIndex].hand;
  const groups=new Map();
  hand.forEach(c=>{
    if(!groups.has(c.rank))groups.set(c.rank,[]);
    groups.get(c.rank).push(c);
  });

  // まず出せる組み合わせを探す。場が空なら小さい数字を優先する。
  const ranks=[...groups.keys()].sort((a,b)=>a-b);
  if(!table.length){
    for(const r of ranks){
      const group=groups.get(r);
      if(r===16){
        if(group.length)return [group[0]];
      }else{
        return [group[0]];
      }
    }
    return null;
  }

  const need=table.length;
  for(const r of ranks){
    const group=groups.get(r);
    if(group.length>=need){
      const candidate=group.slice(0,need);
      if(canBeat(candidate))return candidate;
    }
  }
  // ジョーカーは単体の場にだけ出す。
  if(need===1&&groups.has(16)&&canBeat([groups.get(16)[0]])){
    return [groups.get(16)[0]];
  }
  return null;
}

function scheduleCPU(){
  if(cpuTimer)clearTimeout(cpuTimer);
  if(gameOver||pending||current===0)return;
  cpuTimer=setTimeout(()=>{
    cpuTimer=null;
    if(gameOver||pending||current===0)return;
    const p=players[current];
    const play=findCPUPlay(current);
    if(play){
      executePlay(current,play);
    }else{
      doPass(current);
    }
  },650);
}

startGame();
